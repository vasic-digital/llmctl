  - id: T072-FU4
    status: complete
    classification: "architectural (per brainstorming discipline) - presented to operator via AskUserQuestion before implementing; operator selected 'Design it now'"
    evidence: "Wired internal/executor.LocalExecutor into a real, live model-lifecycle HTTP dispatch path, closing T073/T075's disclosed 'LocalExecutor constructed nowhere in cmd/llmctld' gap that T072-FU1 explicitly deferred out of scope. Investigation before designing confirmed auth.ActionModelStart/Stop/Delete/View (T066's predefinedRoles table) were consumed by no route anywhere (same class of built-but-unwired gap as TenantStateDir/OpenEncryptedStore before T072-FU1/FU3), and that no doc actually specifies a model-lifecycle API despite rbac.go's own stale doc-comment citation - confirming this is original composition of already-built pieces, not implementation of a pre-specified contract. New internal/api/routes_models.go: POST /v1/tenants/:id/models/:model/{start,stop}, GET .../status, mirroring the existing GET .../visible route's :id/:model path shape. Gating (ALL must hold): authorizeTenantOwnership + decider.CheckRBAC(action-specific: ActionModelStart/Stop/View, orthogonal to ownership per rbac.go's own doc comment) + decider.CheckTenantBoundary (same audited visibility check .../visible uses - a tenant can never start/stop/query a model it never registered). Dispatch is THIS NODE ONLY (no cross-node scheduler exists anywhere, matching T073/T075's disclosed per-node boundary). internal/executor gained WithTenant(tenantID) - a purely additive tenant-scoped-COPY method (Config.TenantID was construction-time-only; one daemon must serve many tenants from a single shared base executor), zero changes to any existing tested method. TDD RED-then-GREEN throughout: 1 new executor test (WithTenant returns a distinct copy, base untouched) + 6 new routes_models_test.go tests using the real bin/llmctl dry-run subprocess (no mocked Executor) - the flagship test proves a real HTTP POST through every real gate writes a real tenant-scoped env file on disk; others prove role-denial, cross-tenant-denial, unregistered-model-denial, real stop, and viewer-can-query/tenant-admin-cannot. cmd/llmctld/main.go: new optional -llmctl-path flag added symmetrically to both clusterFlags (bootstrap) and runClusterJoinReal's own independent flag set (join); registerAuthzRoutes (the shared no-drift call site) extended with a modelExecutor parameter, now also calling RegisterModelRoutes; both subcommands construct executor.New(Config{LLMCtlPath: <flag>}) and pass it through. docs/api-reference.md documents the new routes with an explicit disclosure that the pre-existing Phase-1-era 'planned' route table is stale relative to what Phases 9-12 actually shipped (pre-existing drift, not introduced by or fixed in full by this task). Full verification (fresh, go clean -testcache first): gofmt/go vet/go build clean; go test ./... -race (all 12 packages) zero regressions/races; golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 ./... = 0 issues; bash tests/run_tests.sh 22/22 PASS (unaffected, Go-only)."
    result: "internal/executor.LocalExecutor is now genuinely wired into a live HTTP dispatch path - the last disclosed gap from T072/T073/T075/T072-FU1 is closed."
    honest_scope_boundary: "Dispatch remains single-node only - no cluster-wide model-placement scheduler, no cross-node request forwarding, no automatic node selection exist anywhere in this codebase; an operator/future orchestrator must target the specific node it wants a model started on directly. Same already-disclosed per-node boundary as T073/T075, not a new limitation."

