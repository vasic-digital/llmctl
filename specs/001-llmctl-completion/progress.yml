follow_up_work:
  - id: T072-FU1
    status: complete
    evidence: "Wired per-tenant cgroup isolation into the real service-spawn path on both the bash and Go sides, closing the gap T072/T075/T083 each already honestly disclosed. Investigated lib/service_linux.sh in full BEFORE writing any code (Sec11.4.102): the naive systemd-run-wrap-around-LocalExecutor's-exec.Command plan would have been a bluff fix, since bin/llmctl start <profile> hands the real long-running model-server process off to systemd's OWN user-manager via `systemctl --user start`, independent of the short-lived CLI invocation's own cgroup - cgroup placement resolves from the unit's own Slice= property. Correct mechanism: a per-instance systemd drop-in file. Bash side (lib/service_linux.sh): added _svc_validate_tenant_id/_svc_instance_key/_svc_ensure_tenant_slice_dropin; svc_write_env/_svc_unit_for/svc_enable/svc_disable/svc_start/svc_restart/svc_logs route through tenant-aware instance keying; svc_enable AND svc_start both independently ensure the drop-in exists. New tests/test_tenant_service_isolation.sh: 15/15 assertions (untenanted path byte-identical, same profile name resolves to 2 distinct env files/units under 2 tenants with zero collision, real Slice= drop-in written and correct, malicious tenant IDs rejected rc=1). Full bash suite 22/22 PASS (up from 21, zero regressions). Go side (internal/executor/local.go): Config gained TenantID; run() sets LLMCTL_TENANT_ID in the real subprocess env when non-empty (untenanted behavior byte-identical). New TestLocalExecutor_Start_WithTenantID_WritesTenantScopedEnvFile - genuine real-subprocess, real-bash-mechanism proof (never sets LLMCTL_TENANT_ID via t.Setenv on the test process, so the only way it reaches the subprocess is via LocalExecutor.run()'s own injection; asserts on the real tenant-qualified env file bin/llmctl's real lib/service_linux.sh either did or didn't write). TDD RED confirmed first on both sides (bash: 15 real failures before implementation; Go: compile-time RED for the missing field, then genuine behavioral RED - file missing - before wiring run()), then GREEN. gofmt/go vet/go build clean; go test ./... -race (fresh, all 12 packages) zero regressions, zero races; bash tests/run_tests.sh 22/22 PASS."
    honest_scope_boundary: "internal/isolation.TenantStateDir (Clarification 18's per-tenant KV-cache/WAL directory half) remains independently correct and independently tested but has NO caller on either side - wiring it needs a decision about how a tenant-scoped model-DATA path threads into bin/llmctl's existing LLMCTL_DATA_DIR/model-storage conventions (models are plausibly a SHARED resource across tenants; only runtime state needs isolating), which this task does not invent speculatively. internal/executor.LocalExecutor itself also remains unconstructed anywhere in cmd/llmctld (confirmed via a fresh grep audit before writing code) - it is dead code from the daemon's runtime perspective, exactly as T073's own evidence entry already disclosed; wiring it into a live HTTP/scheduler dispatch path in cmd/llmctld is separate, larger scope not claimed done here."
  - id: T072-FU2
    status: complete
    evidence: "Closed T072-FU1's disclosed TenantStateDir gap by wiring it into internal/replication's Store (the WAL/checkpoint bbolt-backed pair that internal/tenancy/key.go's own pre-existing doc comment already identifies as what Clarification 18/20 mean by 'KV cache checkpoints and WAL entries' - genuinely distinct from llama.cpp's own --slot-save-path flag, confirmed real but currently unwired via submodules/llama.cpp source, and from LLMCTL_MODELS_DIR's shared read-only model weight files, confirmed via grep to be written only by lib/download.sh). Before this task, replication.OpenStore(stateDir, ...) was called exactly once per node in cmd/llmctld/main.go, shared across every tenant a node might serve - a real Clarification-18 gap. New internal/replication/registry.go: StoreRegistry lazily opens+caches one *Store per tenant ID, routing every non-empty tenant ID through internal/isolation.TenantStateDir (same allow-list/0700-permission mechanism as T072-FU1, never re-implemented); Get(\"\") opens baseDir directly, byte-identical to the pre-existing behavior. 6/6 new registry_test.go tests (TDD RED - undefined: NewStoreRegistry - then GREEN): backward compat, real on-disk per-tenant isolation with verified 0700 dirs, Get caching, malicious tenant ID rejection, Close releasing every opened store's bbolt locks. internal/api/routes_replication.go: RegisterReplicationRoutes now takes *StoreRegistry, resolves the real Store per request via an optional X-Tenant-ID header (absent -> empty/default tenant). New real-HTTP/3+mTLS test TestReplicationRoutes_DifferentTenantHeaders_AreIsolatedRealHTTP3RoundTrip proves two callers distinguished only by that header never see each other's appended tokens; the pre-existing round-trip test updated to construct a StoreRegistry (genuine compile RED then fixed) and, sending no header, doubles as regression coverage for the untenanted default path. cmd/llmctld/main.go's two wiring sites (bootstrap/join) updated symmetrically to NewStoreRegistry (lazy open, disclosed as the one behavior change: a per-tenant Store-open failure now surfaces on that tenant's first request rather than at node startup; no test depended on eager-open-at-startup). Full verification (fresh, go clean -testcache first): gofmt/go vet/go build clean; go test ./... -race (all 12 packages) zero regressions/races, explicitly re-confirmed by name (both replication tests + TestClusterFailover_KillingLeaderElectsNewRealLeaderAmongSurvivors + TestFailoverState_KVCacheSurvivesPrimaryKill all PASS); bash tests/run_tests.sh 22/22 PASS (unaffected, Go-only change)."
