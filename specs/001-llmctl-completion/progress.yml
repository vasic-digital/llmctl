  - id: T072-FU3
    status: complete
    evidence: "Closed T072-FU2's disclosed encryption-at-rest boundary. New NewEncryptedStoreRegistry(baseDir, cfg, masterSecret) mirrors the pre-existing OpenStore/OpenEncryptedStore naming pair: a non-empty tenant ID's Store opens via OpenEncryptedStore under a key internal/tenancy.DeriveKey derives specifically for that tenant from masterSecret, so two tenants sharing one master secret never share a readable key. The empty tenant ID is deliberately exempt under either constructor (represents no-tenant/single-node mode; T072-FU2's Get(\"\")-byte-identical-to-OpenStore invariant holds unconditionally). NewStoreRegistry (plain constructor) unaffected. 3 new registry_test.go tests, TDD RED (undefined: NewEncryptedStoreRegistry) then GREEN: genuine-ciphertext proof (re-open with a bare keyless OpenStore fails to Restore, AES-GCM auth-tag fails closed), per-tenant-derived-key independence proven at the registry wiring layer (tenant-b's key cannot decrypt tenant-a's directory), plain-registry default-path reconfirmed unaffected. cmd/llmctld/main.go: new OPTIONAL tenantEncryptionKeyEnvVar=LLMCTLD_TENANT_ENCRYPTION_KEY (zero-means-unset convention, unlike the required JWT signing key, since encryption at rest is opt-in hardening); new newStoreRegistry helper resolves NewEncryptedStoreRegistry-vs-NewStoreRegistry in one place both bootstrap/join call sites use, so they cannot drift. .env.example documents the new var. Full verification (fresh, go clean -testcache first): gofmt/go vet/go build clean; go test ./... -race (all 12 packages) zero regressions/races; bash tests/run_tests.sh 22/22 PASS (unaffected, Go-only)."
