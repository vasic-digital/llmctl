# helix-deps.yaml — llmctl Submodule-Dependency Manifest
# Per HelixConstitution §11.4.31 (Submodule-Dependency-Manifest Mandate).
# Own-org (vasic-digital / HelixDevelopment) dependencies are listed, plus superspec (WangX0111, third-party):
# it is listed because llmctl RESOLVES it like the others, not because llmctl owns it. The engines llmctl
# itself pins as submodules (llama.cpp, colibri; third-party) are in .gitmodules only.
# Single source of truth (owner mandate 2026-10-21): constitution, containers and superspec are NOT vendored
# by llmctl any more; the constitution hub vendors containers and superspec (grouped layout) at <hub>/submodules/<name>.
# llmctl resolves them at run time (lib/resolve_deps.sh: env LLMCTL_{CONSTITUTION,CONTAINERS,SUPERSPEC}_DIR ->
# <hub>/submodules/<name> -> <root>/submodules/<name> -> sibling clones -> ancestors -> opt-in host fallback)
# and links them (scripts/link_deps.sh). llmctl pins nothing for them ("resolved by lib/resolve_deps.sh").
# Previous gitlinks (recovery only): constitution 8a604628ebf4af9ac19a70014e640edd9024d43b,
# containers 4a8f04e05f3535d77c48f69b89687f9fcc896fbf, superspec c20ac6c1ba069cc9a72dacb8044b7b193d3dde81.
# Last updated: 2026-10-21 (chore/single-source-layout).

schema_version: 1

deps:
  - name: constitution
    ssh_url: git@github.com:HelixDevelopment/constitution.git
    ref: main
    why: "Canonical-root Helix Constitution (project CLAUDE.md inherits it); resolved by lib/resolve_deps.sh (the hub llmctl is nested in), not pinned"
    layout: flat

  - name: containers
    ssh_url: git@github.com:vasic-digital/Containers.git
    ref: main
    why: "Dynamic port allocation, service registry/discovery, health probes and rootless container boot for the decision layer and its transport tests (spec FR-088..091, Helix §11.4.76); consumed from Go via go.mod replace => ./submodules/containers; resolved by lib/resolve_deps.sh (hub copy), not pinned"
    layout: grouped   # the hub vendors it under <hub>/submodules/containers
    path: submodules/containers   # llmctl-local convenience link (untracked, scripts/link_deps.sh); the go.mod replace target

  - name: superspec
    ssh_url: git@github.com:WangX0111/superspec.git
    ref: main
    why: "Spec Kit superspec extension (third-party, consumed read-only)"
    third_party: true
    licence: MIT   # verified from the LICENSE file of the hub checkout (constitution/submodules/superspec/LICENSE)
    layout: grouped   # the hub vendors it under <hub>/submodules/superspec
    path: submodules/superspec    # llmctl-local convenience link (untracked, scripts/link_deps.sh)

transitive_handling:
  recursive: true
  conflict_resolution: operator-required

language_specific_subtree: false
